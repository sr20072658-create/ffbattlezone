<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free Fire Tournament</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--text:#1b1b1f;--muted:#6b6b76;--accent:#e8590c;--line:#e4dfd6;--ok:#2b8a3e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121216;--card:#1c1c22;--text:#f2f2f5;--muted:#9a9aa6;--accent:#ff7a2f;--line:#2c2c35;--ok:#51cf66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121216;--card:#1c1c22;--text:#f2f2f5;--muted:#9a9aa6;--accent:#ff7a2f;--line:#2c2c35;--ok:#51cf66;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{padding:22px 16px 10px;max-width:640px;margin:auto}
h1{margin:0;font-size:24px}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
main{max-width:640px;margin:auto;padding:8px 16px 40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mode b{display:block;font-size:16px}
.mode span{font-size:12px;color:var(--muted)}
.mode.on{border-color:var(--accent);outline:2px solid var(--accent)}
h2{font-size:17px;margin:22px 0 10px}
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.match small{color:var(--muted);display:block}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.qr{width:170px;height:170px;margin:10px auto;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12px;padding:8px}
.qrimg{width:220px;max-width:70%;height:auto;border-radius:12px;background:#fff;margin:8px auto;display:block}
.steps{font-size:13px;color:var(--muted);padding-left:18px;margin:8px 0}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}
.status{font-size:12px;border-radius:99px;padding:3px 10px;background:var(--bg);border:1px solid var(--line)}
.status.ok{color:var(--ok);border-color:var(--ok)}
.empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
<h1>🔥 Free Fire Tournament</h1>
<p>Mode चुनो → Join करो → QR से Entry Fee दो → Room ID & Password पाओ</p>
<p><a href="https://www.instagram.com/ff_battlezone12" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">📸 Instagram पर Follow करो</a></p>
</header>
<main>
<div class="grid" id="modes"></div>
<h2 id="mt">Matches</h2>
<div id="matches"></div>
<h2>मेरे Matches</h2>
<div id="mine"><p class="empty">अभी कोई Match Join नहीं किया।</p></div>
</main>

];

var cur = MODES[0].id, joined = [];
try { joined = JSON.parse(localStorage.getItem("ffjoined") || "[]"); } catch(e) { joined = []; }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function modeOf(id){return MODES.filter(function(m){return m.id===id})[0]}
function save(){try{localStorage.setItem("ffjoined",JSON.stringify(joined))}catch(e){}}
function renderModes(){
 document.getElementById("modes").innerHTML = MODES.map(function(m){
  return '<button class="mode'+(m.id===cur?' on':'')+'" data-id="'+m.id+'"><b>'+esc(m.name)+'</b><span>'+esc(m.sub)+' • ₹'+m.fee+'</span></button>';
 }).join("");
 Array.prototype.forEach.call(document.querySelectorAll(".mode"),function(b){
  b.onclick=function(){cur=b.getAttribute("data-id");renderModes();renderMatches()}
 });
}
function renderMatches(){
 var m=modeOf(cur);
 document.getElementById("mt").textContent=m.name+" — Matches";
 var list=MATCHES.filter(function(x){return x.mode===cur});
 document.getElementById("matches").innerHTML=list.length?list.map(function(x){
  return '<div class="match"><div><b>'+esc(x.time)+'</b><small>Entry ₹'+m.fee+(x.slots?' • '+x.slots+' slots बचे':'')+'</small><small>'+esc(x.prize)+'</small></div><button class="btn" data-m="'+x.id+'">Join</button></div>';
 }).join(""):'<p class="empty">इस Mode में अभी कोई Match नहीं है।</p>';
 Array.prototype.forEach.call(document.querySelectorAll("[data-m]"),function(b){
  b.onclick=function(){openJoin(b.getAttribute("data-m"))}
 });
}
function renderMine(){
 var el=document.getElementById("mine");
 if(!joined.length){el.innerHTML='<p class="empty">अभी कोई Match Join नहीं किया।</p>';return}
 el.innerHTML=joined.map(function(j){
  return '<div class="match"><div><b>'+esc(j.mode)+' • '+esc(j.time)+'</b><small>'+esc(j.name)+' • UID '+esc(j.uid)+'</small><small>Room ID & Password: Match से पहले Organizer भेजेगा</small></div><span class="status">Pending</span></div>';
 }).join("");
}
function openJoin(id){
 var x=MATCHES.filter(function(a){return a.id===id})[0], m=modeOf(x.mode);
 var sheet=document.getElementById("sheet");
 sheet.innerHTML='<h2 style="margin-top:0">'+esc(m.name)+' — '+esc(x.time)+'</h2>'
 +'<label>Free Fire Name'+(m.team>1?' (Team Name)':'')+'</label><input id="f_name">'
 +'<label>Free Fire UID'+(m.team>1?' (सभी Players के UID, comma से अलग)':'')+'</label><input id="f_uid" inputmode="numeric">'
 +'<h2>Entry Fee: ₹'+m.fee+'</h2>'
 +'<div style="text-align:center"><img class="qrimg" src="'+QR_SRC+'" alt="UPI QR"><p class="empty" style="margin:4px 0">UPI ID: '+esc(UPI_ID)+'</p></div>'
 +'<ol class="steps"><li>QR स्कैन करके ₹'+m.fee+' भेजो</li><li>नीचे UTR / Transaction नंबर डालो</li><li>Submit दबाओ — Approve होते ही Room ID & Password मिलेगा</li></ol>'
 +'<label>UTR / Transaction Number</label><input id="f_utr" inputmode="numeric">'
 +'<div class="row"><button class="btn ghost" id="f_x">Cancel</button><button class="btn" id="f_ok">Submit</button></div>';
 document.getElementById("modal").className="modal show";
 document.getElementById("f_x").onclick=closeM;
 document.getElementById("f_ok").onclick=function(){
  var name=document.getElementById("f_name").value.trim(),uid=document.getElementById("f_uid").value.trim(),
      utr=document.getElementById("f_utr").value.trim();
  if(!name||!uid||!utr){alert("सारी details भरो");return}
  joined.push({mode:m.name,time:x.time,name:name,uid:uid});save();renderMine();closeM();
  var txt="DONE ✅ Payment kar di\nUTR: "+utr+"\nMode: "+m.name+"\nMatch: "+x.time+"\nName: "+name+"\nUID: "+uid+"\nFee: Rs "+m.fee;
  try{navigator.clipboard.writeText(txt)}catch(e){}
  window.open("https://ig.me/m/"+IG_USER,"_blank");
  alert("Details copy हो गईं। Instagram DM में Paste करके भेज दो।\n\n"+txt);
 };
}
function closeM(){document.getElementById("modal").className="modal"}
document.getElementById("modal").onclick=function(e){if(e.target.id==="modal")closeM()};
renderModes();renderMatches();renderMine();
